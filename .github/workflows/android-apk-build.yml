
name: SGS Mobile Android APK Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: SGSMobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: SGSMobile/**/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check Gradle Wrapper
        run: |
          test -f gradlew || {
            echo "ERROR: SGSMobile/gradlew was not found."
            exit 1
          }
          test -f gradle/wrapper/gradle-wrapper.properties || {
            echo "ERROR: Gradle wrapper properties are missing."
            exit 1
          }
          chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: |
          find app/build/outputs/apk/debug -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SGS-Mobile-debug-apk
          path: SGSMobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
