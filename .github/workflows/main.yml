
name: Android APK Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SGS Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Verify Android project
        working-directory: SGSMobile
        shell: bash
        run: |
          set -e

          if [[ ! -f "./gradlew" ]]; then
            echo "ERROR: Gradle wrapper not found in SGSMobile/"
            exit 1
          fi

          if [[ ! -f "settings.gradle" && ! -f "settings.gradle.kts" ]]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          if [[ ! -f "app/build.gradle" && ! -f "app/build.gradle.kts" ]]; then
            echo "ERROR: App Gradle build file not found."
            exit 1
          fi

          chmod +x ./gradlew
          echo "Android project files verified."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show Gradle project structure
        working-directory: SGSMobile
        run: ./gradlew --no-daemon projects

      - name: Build debug APK
        working-directory: SGSMobile
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK
        working-directory: SGSMobile
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK" ]]; then
            echo "ERROR: APK was not generated at $APK"
            echo "Searching for generated APK files..."
            find app/build/outputs -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SGS-Mobile-debug-apk
          path: SGSMobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
